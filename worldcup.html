.animate-birds {

useEffect(() => {
const openingDate = new Date("2026-06-12T01:00:00+06:00").getTime();
const interval = setInterval(() => {
const difference = openingDate - new Date().getTime();
if (difference <= 0) {
clearInterval(interval);
} else {
setCountdown({
days: Math.max(0, Math.floor(difference / (1000 * 60 * 60 * 24))),
hours: Math.max(0, Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))),
mins: Math.max(0, Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60))),
secs: Math.max(0, Math.floor((difference % (1000 * 60)) / 1000))
});
}
}, 1000);
return () => clearInterval(interval);
}, []);
