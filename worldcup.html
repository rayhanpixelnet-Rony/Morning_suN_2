              days: Math.max(0, Math.floor(difference / (1000 * 60 * 60 * 24))),
              hours: Math.max(0, Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))),
              mins: Math.max(0, Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60))),
              secs: Math.max(0, Math.floor((difference % (1000 * 60)) / 1000))
            });
          }
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (window.lucide) { window.lucide.createIcons(); }
      }, [searchTerm, spacingValue]);

      // ADVANCED SEARCH (Country, Group, Date)
      const filteredFixtures = fixtureData.filter((match) => {
        const query = searchTerm.toLowerCase().trim();
        if (!query) return true;

        const groupName = match.group ? match.group.toLowerCase() : '';
        const country1 = match.team1 ? match.team1.toLowerCase() : '';
        const country2 = match.team2 ? match.team2.toLowerCase() : '';
        const matchDate = match.time ? match.time.toLowerCase() : '';

        return (
          groupName.includes(query) ||
          country1.includes(query) ||
          country2.includes(query) ||
          matchDate.includes(query)
        );
      });

      const togglePredict = (matchId, teamName) => {
        setPredictions(prev => ({
          ...prev,
          [matchId]: prev[matchId] === teamName ? null : teamName
        }));
      };

      return (
        <div className="flex-grow flex flex-col">
          {/* HEADER SECTION - STATIC LOGO */}
          <header className="sticky top-0 z-50 bg-[#0E2A54]/95 backdrop-blur-md border-b border-[#FAD15B]/30 shadow-2xl px-4 py-3.5">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-4">
                <img 
                  src="logo.png" 
                  alt="Morning Sun FC Logo" 
                  className="h-12 w-12 object-contain"
                />
                <div>
                  <h1 className="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#FAD15B] via-yellow-400 to-amber-300 leading-tight uppercase tracking-wider">
                    Morning Sun Football Club
                  </h1>
                  <p className="text-xs text-[#5E8F35] font-bold tracking-widest uppercase">Premium Fixture Desk</p>
                </div>
              </div>

              <div className="flex items-center gap-2 bg-[#091a32] border border-white/10 rounded-xl px-4 py-2 shadow-inner">
                <i data-lucide="clock" class="w-4 h-4 text-[#FAD15B]"></i>
                <span className="text-xs font-bold text-gray-400 uppercase mr-1">Cup Kickoff:</span>
                <div className="flex items-center gap-1 text-xs font-mono font-bold tracking-wide">
                  <span className="text-white">{countdown.days}d</span>:
                  <span className="text-white">{String(countdown.hours).padStart(2, '0')}h</span>:
                  <span className="text-white">{String(countdown.mins).padStart(2, '0')}m</span>:
                  <span className="text-amber-400">{String(countdown.secs).padStart(2, '0')}s</span>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-grow max-w-7xl w-full mx-auto px-4 py-8 flex flex-col gap-8">
            
            {/* GROUPS HERO BANNER - ANIMATED VIDEO LOOP */}
            <section className="bg-gradient-to-br from-[#0E2A54] via-[#091a32] to-[#061021] border border-[#FAD15B]/20 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden flex flex-col lg:flex-row items-center justify-between gap-8">
              <div className="space-y-4 max-w-3xl text-center lg:text-left">
                <span className="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs font-extrabold bg-[#E5A93B]/10 text-[#FAD15B] border border-[#E5A93B]/20 uppercase tracking-widest">
                  FIFA World Cup 2026 Scheduling Desk
                </span>
                <h2 className="text-3xl sm:text-4xl lg:text-5xl font-black text-white leading-tight uppercase tracking-tight">
                  FIFA World Cup 2026 <span className="text-[#FAD15B]">Groups & Fixtures</span>
                </h2>
                <p className="text-gray-300 text-sm sm:text-base leading-relaxed">
                  Track group stage match schedules customized to Dhaka Time and check instant team profiles. Adjust your card margins smoothly below.
                </p>

                <div className="bg-[#091a32]/80 border border-white/5 rounded-xl p-4 inline-flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto">
                  <div className="flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-[#FAD15B]"></i>
                    <span className="text-xs font-bold text-gray-300 uppercase tracking-wide">Adjust Spacing:</span>
                  </div>
                  <input 
                    type="range" 
                    min="12" 
                    max="40" 
                    value={spacingValue} 
                    onChange={(e) => setSpacingValue(parseInt(e.target.value))}
                    className="w-40 accent-[#E5A93B] cursor-pointer"
                  />
                  <span className="text-xs font-mono font-bold text-[#FAD15B] bg-[#0E2A54] px-2 py-1 rounded">
                    {spacingValue}px
                  </span>
                </div>
              </div>

              {/* Animated Studio Asset Container */}
              <div className="bg-[#091a32] border border-[#FAD15B]/20 rounded-2xl p-5 shadow-2xl flex flex-col items-center text-center w-64 shrink-0">
                <div className="relative w-32 h-32 rounded-xl overflow-hidden bg-black border-2 border-[#FAD15B] flex items-center justify-center">
                  <video
                    src="animated-showcase.mp4" 
                    autoPlay
                    loop
                    muted
                    playsInline
                    className="h-full w-full object-cover"
                  />
                </div>
                <h4 className="text-xs font-black text-white uppercase mt-4 tracking-wide">Studio Broadcast Loop</h4>
              </div>
            </section>

            {/* INTEGRATED MATRICES SEARCH CONTROLS */}
            <section className="bg-[#0b1b33] border border-white/5 rounded-xl p-6 shadow-xl space-y-4">
              <div className="relative w-full">
                <i data-lucide="search" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                <input
                  type="text"
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  placeholder="Search by Group (e.g. Group C), Country (e.g. Brazil), or Date (e.g. Jun 24)..."
                  className="w-full bg-[#061021] text-white pl-12 pr-4 py-3.5 rounded-xl border border-gray-700/80 focus:outline-none focus:border-[#E5A93B] text-sm font-medium shadow-inner"
                />
              </div>
              <div className="flex flex-wrap gap-2 items-center text-xs font-bold text-gray-400 uppercase tracking-wider">
                <span>Quick Parameters:</span>
                <button onClick={() => setSearchTerm('Group C')} className="text-[#FAD15B] hover:underline bg-[#061021] px-2.5 py-1 rounded border border-white/5">"Group C"</button>
                <button onClick={() => setSearchTerm('Brazil')} className="text-[#FAD15B] hover:underline bg-[#061021] px-2.5 py-1 rounded border border-white/5">"Brazil"</button>
                <button onClick={() => setSearchTerm('Jun 24')} className="text-[#FAD15B] hover:underline bg-[#061021] px-2.5 py-1 rounded border border-white/5">"Jun 24"</button>
                <button onClick={() => setSearchTerm('')} className="text-gray-400 hover:underline bg-[#061021] px-2.5 py-1 rounded border border-white/5">Reset Filter</button>
              </div>
            </section>

            <div className="flex items-center justify-between border-b border-gray-800 pb-2">
              <p className="text-xs uppercase text-gray-400 tracking-widest font-black">Match Matrix Layout</p>
              <p className="text-xs text-gray-400">
                Matches shown: <span className="text-[#FAD15B] font-bold">{filteredFixtures.length}</span> / 72
              </p>
            </div>

            {/* MAIN FIXTURE RENDERING GRID */}
            <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredFixtures.length > 0 ? (
                filteredFixtures.map((match) => (
                  <div 
                    key={match.id}
                    className="bg-gradient-to-b from-[#0b1b33] to-[#061021] border border-white/5 hover:border-[#FAD15B]/40 rounded-2xl transition-all duration-300 shadow-xl overflow-hidden relative"
                    style={{ padding: `${spacingValue}px` }}
                  >
                    <div className="flex items-center justify-between border-b border-gray-800 pb-3 mb-4">
                      <div className="flex items-center gap-2">
                        <span className="w-7 h-7 rounded-lg bg-[#112f57] border border-[#FAD15B]/30 flex items-center justify-center text-xs font-black text-[#FAD15B] font-mono">
                          {match.matchNum}
                        </span>
                        <span className="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Match</span>
                      </div>
                      <span className="px-3 py-1 rounded-full text-[10px] font-black bg-[#E5A93B]/10 text-[#FAD15B] border border-[#E5A93B]/20 uppercase">
                        {match.group}
                      </span>
                    </div>

                    <div className="space-y-3">
                      <div 
                        onClick={() => togglePredict(match.id, match.team1)}
                        className={`flex items-center justify-between p-2.5 rounded-xl cursor-pointer border transition-all ${
                          predictions[match.id] === match.team1 ? 'bg-[#5E8F35]/15 border-[#5E8F35]' : 'bg-[#091a32]/40 border-transparent hover:bg-[#091a32]'
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <span className="text-3xl filter drop-shadow-md">{match.team1Flag}</span>
                          <div>
                            <p className="font-extrabold text-sm text-white uppercase tracking-wide">{match.team1}</p>
                            <p className="text-[10px] text-gray-400 font-bold uppercase">{match.team1Code}</p>
                          </div>
                        </div>
                        {predictions[match.id] === match.team1 && <i data-lucide="check-circle" class="w-4 h-4 text-[#5E8F35]"></i>}
                      </div>

                      <div className="flex items-center justify-center gap-4 text-xs font-bold text-gray-500 my-1 uppercase tracking-widest">
                        <div className="h-[1px] bg-gray-800 flex-grow" />
                        <span>VS</span>
                        <div className="h-[1px] bg-gray-800 flex-grow" />
                      </div>

                      <div 
                        onClick={() => togglePredict(match.id, match.team2)}
                        className={`flex items-center justify-between p-2.5 rounded-xl cursor-pointer border transition-all ${
                          predictions[match.id] === match.team2 ? 'bg-[#5E8F35]/15 border-[#5E8F35]' : 'bg-[#091a32]/40 border-transparent hover:bg-[#091a32]'
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <span className="text-3xl filter drop-shadow-md">{match.team2Flag}</span>
                          <div>
                            <p className="font-extrabold text-sm text-white uppercase tracking-wide">{match.team2}</p>
                            <p className="text-[10px] text-gray-400 font-bold uppercase">{match.team2Code}</p>
                          </div>
                        </div>
                        {predictions[match.id] === match.team2 && <i data-lucide="check-circle" class="w-4 h-4 text-[#5E8F35]"></i>}
                      </div>
                    </div>

                    <div className="mt-4 pt-3 border-t border-gray-800/80 flex flex-col gap-2 text-xs">
                      <div className="flex items-center gap-1.5 text-gray-300">
                        <i data-lucide="calendar" class="w-3.5 h-3.5 text-[#FAD15B]"></i>
                        <span className="font-extrabold text-[#FAD15B]">{match.time}</span>
                        <span className="bg-[#112f57] text-blue-300 px-1 rounded text-[9px] font-bold">BD Time</span>
                      </div>
                      <div className="flex items-start gap-1.5 text-gray-400">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-green-400 shrink-0 mt-0.5"></i>
                        <span className="leading-tight text-[11px]">{match.stadium}, <strong class="text-gray-200">{match.city}</strong></span>
                      </div>
                    </div>
                  </div>
                ))
              ) : (
                <div className="col-span-full text-center py-16 bg-[#0b1b33] border border-white/5 rounded-2xl">
                  <i data-lucide="alert-circle" class="w-8 h-8 text-amber-400 mx-auto mb-2"></i>
                  <p className="text-sm font-bold text-gray-300">No match records match your targeted parameters.</p>
                </div>
              )}
            </section>

            {/* FOOTER SECTION - STATIC LOGO */}
            <footer className="mt-8 bg-gradient-to-r from-[#0E2A54] to-[#112f57] border border-[#FAD15B]/30 rounded-2xl p-6 sm:p-8 flex flex-col lg:flex-row items-center justify-between gap-6 shadow-2xl">
              <div className="flex flex-col sm:flex-row items-center gap-4 text-center sm:text-left">
                <img 
                  src="logo.png" 
                  alt="Morning Sun FC Logo" 
                  className="h-14 w-14 object-contain"
                />
                <div>
                  <p className="font-black text-lg text-white uppercase tracking-wider">Morning Sun Football Club</p>
                  <p className="text-xs text-gray-300 mt-1 flex items-center justify-center sm:justify-start gap-1">
                    <i data-lucide="map-pin" class="w-4 h-4 text-green-400"></i>
                    Wapda Colony, Jatrabari, Dhaka-1236, Bangladesh
                  </p>
                </div>
              </div>

              <div className="flex flex-col sm:flex-row gap-3 items-center w-full sm:w-auto">
                <a 
                  href="https://www.morningsunfootball.club/" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="flex items-center justify-center gap-2 bg-[#061021] text-white font-extrabold text-xs px-5 py-3 rounded-xl border border-gray-700 hover:border-[#FAD15B] transition-all w-full sm:w-auto"
                >
                  <i data-lucide="globe" class="w-4 h-4 text-[#FAD15B]"></i>
                  <span>Visit Website</span>
                </a>
                <a 
                  href="https://www.facebook.com/MorningSunFC" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="flex items-center justify-center gap-2 bg-[#1877F2] text-white font-extrabold text-xs px-5 py-3 rounded-xl hover:bg-blue-600 transition-all w-full sm:w-auto"
                >
                  <i data-lucide="facebook" class="w-4 h-4 text-white"></i>
                  <span>Facebook Page</span>
                </a>
              </div>
            </footer>
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('app'));
    setTimeout(() => { if (window.lucide) { window.lucide.createIcons(); } }, 200);
  </script>
</body>
</html>
